<!-- templates/store/pages/categories/delete.html -->
{% extends 'admin_base.html' %}

{% block main %}
  <div class="col-9 p-3">
    <h2 class="text-danger">Delete Category</h2>
    <p>Are you sure you want to delete the category "{{ object.name }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'store_categories' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
