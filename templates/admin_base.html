<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ TITLE }} ADMIN</title>

    <!-- Bootstrap 4.5.0 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous" />

    <!-- 共通のfont -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- 共通のCSS -->
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'frontend/css/store/base.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'frontend/css/buttonDesigns.css' %}" />

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- 各ページごとのCSS -->
    {% block style %}

    {% endblock %}
  </head>

  <body>
    <header>
      {% block header %}
        {% include 'store/snippets/header.html' %}
      {% endblock %}
    </header>

    <main>
      <div class="row justify-content-center px-4 mb-5 mx-auto" style="margin-top:100px;">
        <div class="col-12 col-md-3 mb-5 w-100">
          {% include 'store/snippets/menu.html' %}
        </div>
        <div class="col-12 col-md-9 p-0 card" style="overflow-x: auto;">
          {% block main %}

          {% endblock %}
        </div>
      </div>
    </main>

    <!-- 各ページごとのJS -->
    {% block script %}

    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
