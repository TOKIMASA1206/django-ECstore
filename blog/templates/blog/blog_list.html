{% extends 'base.html' %}

{% block main %}
<section>
  <div class="container mb-5" style="margin-top:100px;">
    <div class="row">
      <div class="my-3">
        <h1 class="fs-4">Our Blog</h1>
      </div>
    </div>

    <div class="row">
      {% for post in posts %}
        <div class="col-6 col-md-4 col-lg-3 my-2">
          {% include 'snippets/blog_box.html' %} 
        </div>
      {% empty %}
      
      <div class="text-center mb-5">
        <p class="inform_icon">
          <i class="fa-solid fa-cat"></i>
        </p>
        <p class="h3 mb-4">No blog posts yet.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
