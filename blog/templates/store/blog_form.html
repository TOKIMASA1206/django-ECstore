{% extends 'store/blog_base.html' %}

{% block main %}
<section>
  <div class="container-fluid" style="margin-top:100px;">
    <h2>{% if object %}Edit{% else %}Add{% endif %} Blog Post</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'blog_store_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</section>
{% endblock %}
