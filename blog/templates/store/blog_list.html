{% extends 'store/blog_base.html' %}

{% block main %}
<section>
  <div class="container-fluid" style="margin-top:100px;">
    <div class="row">
      <div class="col-6 my-3">
        <h1 class="section_title">Blog</h1>
      </div>
      <div class="col-6 my-3 text-right">
        <a href="{% url 'blog_add' %}" class="btn btn-dark">Create New Post</a>
      </div>  
    </div>
  {% for post in posts %}
    <div class="col-6 col-md-4 col-lg-3 my-2">
      {% include 'snippets/blog_box.html' %} 
    </div>
  {% empty %}
    <div class="text-center mb-5">
      <p class="inform_icon">
        <i class="fa-solid fa-cat"></i>
      </p>
      <p class="h3 mb-4">No blog posts yet.</p>
    </div>
  {% endfor %}
  </div>
</section>
{% endblock %}
